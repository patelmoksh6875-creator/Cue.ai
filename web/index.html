<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cue</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🎧 Cue</div>
    <div id="status" class="status" aria-live="polite"></div>
    <button id="quit-btn" class="btn btn-ghost" title="Stop the Cue server">Quit Cue</button>
  </header>

  <main class="layout">
    <section class="seed-panel">
      <label for="search-input" class="field-label">Seed song</label>
      <div class="search-row">
        <input id="search-input" type="text" placeholder="Search for a song..." autocomplete="off">
      </div>
      <ul id="search-results" class="search-results" hidden></ul>

      <div id="seed-card" class="seed-card" hidden></div>

      <button id="find-matches-btn" class="btn btn-primary" hidden>Find matches</button>
      <div id="match-progress" class="progress-text" hidden></div>
    </section>

    <section id="filter-bar" class="filter-bar" hidden>
      <div class="filter-group">
        <span class="field-label">Artist</span>
        <div id="artist-filters" class="chip-list"></div>
      </div>
      <div class="filter-group">
        <span class="field-label">Genre</span>
        <div id="genre-filters" class="chip-list"></div>
      </div>
      <div class="filter-group sort-group">
        <span class="field-label">Sort by</span>
        <select id="sort-select">
          <option value="match_pct">Match %</option>
          <option value="bpm">BPM</option>
          <option value="key">Key</option>
        </select>
      </div>
      <button id="clear-filters-btn" class="btn btn-ghost">Clear filters</button>
    </section>

    <div id="results-note" class="results-note" hidden></div>
    <section id="results" class="results" aria-live="polite"></section>
  </main>

  <audio id="player" hidden></audio>

  <script type="module" src="app.js"></script>
</body>
</html>
