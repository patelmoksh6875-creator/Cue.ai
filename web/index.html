<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cue</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🎧 Cue</div>
    <div id="status" class="status" aria-live="polite"></div>
    <button id="quit-btn" class="btn btn-ghost" title="Stop the Cue server">Quit Cue</button>
  </header>

  <main class="layout">
    <section class="seed-panel">
      <label for="search-input" class="field-label">Seed song</label>
      <div class="search-row">
        <input id="search-input" type="text" placeholder="Search for a song..." autocomplete="off">
      </div>
      <ul id="search-results" class="search-results" hidden></ul>

      <div id="seed-card" class="seed-card" hidden></div>

      <button id="find-matches-btn" class="btn btn-primary" hidden>Find matches</button>
      <div id="match-progress" class="progress-text" hidden></div>
    </section>

    <section id="filter-bar" class="filter-bar" hidden>
      <div class="filter-search-row">
        <input
          id="filter-input"
          type="text"
          placeholder="Filter by artist or genre... (press / to focus)"
          autocomplete="off"
          role="combobox"
          aria-expanded="false"
          aria-controls="filter-suggestions"
          aria-autocomplete="list">
        <ul id="filter-suggestions" class="filter-suggestions" hidden role="listbox"></ul>
      </div>
      <div id="filter-chips" class="chip-list" aria-label="Active filters"></div>
      <div class="filter-row-bottom">
        <div class="sort-group">
          <span class="field-label">Sort by</span>
          <select id="sort-select">
            <option value="match_pct">Match %</option>
            <option value="bpm">BPM</option>
            <option value="key">Key</option>
          </select>
        </div>
        <button id="clear-filters-btn" class="btn btn-ghost" hidden>Clear all</button>
      </div>
    </section>

    <div id="results-note" class="results-note" hidden></div>
    <section id="results" class="results" aria-live="polite"></section>
  </main>

  <audio id="player" hidden></audio>

  <div id="offline-overlay" class="offline-overlay" hidden role="alert">
    <div class="offline-box">
      <div class="offline-title">Cue isn't running</div>
      <div class="offline-body">Open it again from Cue.app, or run <code>python cue.py</code>.</div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
